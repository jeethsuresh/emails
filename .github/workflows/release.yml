name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: release
        run: node scripts/plan-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    needs: plan
    if: github.event_name == 'pull_request' || needs.plan.outputs.publish == 'true'
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            runs-on: macos-15
            goos: darwin
            goarch: arm64
            electron_args: --mac --arm64
            artifact_glob: release/Email-*-mac-arm64.dmg

          - name: windows-x64
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            electron_args: --win --x64
            artifact_glob: release/*.exe

          - name: linux-x64
            runs-on: ubuntu-22.04
            goos: linux
            goarch: amd64
            electron_args: --linux deb rpm pacman AppImage --x64
            artifact_glob: |
              release/*.deb
              release/*.rpm
              release/*.pacman
              release/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install wasi-sdk
        shell: bash
        run: bash scripts/install-wasi-sdk.sh

      - name: Install Linux packagers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Ubuntu/Debian: `rpm` provides rpmbuild. There is no `rpm-build` package
          # (that name is Fedora/RHEL-only).
          sudo apt-get install -y --no-install-recommends \
            rpm \
            libarchive-tools \
            libfuse2 \
            fakeroot

      - name: Install npm dependencies
        run: npm ci

      - name: Build C WASM
        run: npm run build:native

      - name: Stage Go backend
        shell: bash
        run: |
          chmod +x scripts/stage-backend.sh
          ./scripts/stage-backend.sh "${{ matrix.goos }}" "${{ matrix.goarch }}"

      - name: Build UI and Electron
        run: npm run build:ui

      - name: Package with electron-builder
        shell: bash
        run: npx electron-builder --config electron-builder.yml ${{ matrix.electron_args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release outputs
        shell: bash
        run: ls -la release || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emails-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  macos-sign:
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    needs: [plan, package]
    runs-on: macos-15
    timeout-minutes: 55
    environment: macos-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: bash scripts/install-wasi-sdk.sh
      - run: npm ci
      - run: npm run build:native
      - run: bash scripts/stage-backend.sh darwin arm64
      - run: npm run build:ui
      - name: Sign, notarize, and verify the Apple Silicon app and disk image
        run: python3 scripts/package-macos-release.py
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_NOTARY_KEY_BASE64: ${{ secrets.MAC_NOTARY_KEY_BASE64 }}
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: signed-email-mac
          path: release/Email-*-mac-arm64.dmg
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    needs: [plan, package, macos-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.plan.outputs.tag }}
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          pattern: emails-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: signed
          name: signed-email-mac
      - name: Publish the verified platform packages
        shell: bash
        run: |
          disk="Email-${RELEASE_TAG#v}-mac-arm64.dmg"
          test -s "signed/$disk"
          test -f "dist-release/$disk"
          test "$(find dist-release -maxdepth 1 -name '*.dmg' -type f | wc -l)" -eq 1
          cp "signed/$disk" "dist-release/$disk"
          gh release create "$RELEASE_TAG" dist-release/* --target "$GITHUB_SHA" --draft \
            --title "Email $RELEASE_TAG" --notes "Email for Apple Silicon is signed with Developer ID and notarized by Apple. Windows and Linux packages are available in the same release."
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq --arg tag "$RELEASE_TAG" -e '.[] | select(.tag_name == $tag and .draft) | .assets' > "$RUNNER_TEMP/email-assets.json"
          python3 - "$RUNNER_TEMP/email-assets.json" <<'VERIFY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          uploaded = {asset["name"]: asset for asset in json.loads(Path(sys.argv[1]).read_text())}
          files = list(Path("dist-release").iterdir())
          if set(uploaded) != {file.name for file in files}:
              raise SystemExit("Release asset list differs from the verified packages")
          for file in files:
              with file.open("rb") as stream:
                  digest = "sha256:" + hashlib.file_digest(stream, "sha256").hexdigest()
              asset = uploaded[file.name]
              if (asset["size"], asset["digest"]) != (file.stat().st_size, digest):
                  raise SystemExit(f"Upload verification failed: {file.name}")
          VERIFY
          gh release edit "$RELEASE_TAG" --draft=false

  pages:
    name: Deploy GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write latest.json
        run: node scripts/write-latest-json.mjs "${{ needs.publish.outputs.tag }}" website/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
